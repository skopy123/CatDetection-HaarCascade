name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Frontend syntax check
        run: for f in frontend/js/*.js; do node --input-type=module --check < "$f"; done
      - name: Unit and API tests (no models)
        run: uv run pytest -v

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/catalarm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: catalarm:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # optional repository secret; without it DINOv3 is simply left out
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
      - name: Self-test with real models
        run: docker run --rm catalarm:test python -m catalarm.tools.selftest
      - name: Smoke test (container starts, health and UI respond)
        run: |
          docker run -d --name smoke -p 8080:8080 -e RTSP_URL="fake:/app/testImg?fps=5" catalarm:test
          for i in $(seq 1 60); do
            if curl -sf "localhost:8080/api/v1/health?strict=true" > /dev/null; then break; fi
            sleep 2
          done
          curl -sf "localhost:8080/api/v1/health?strict=true" | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf localhost:8080/ > /dev/null
          curl -sf localhost:8080/api/v1/gallery/cats | grep -q maugli
          curl -sf -o /dev/null localhost:8080/api/v1/cameras/cathouse/snapshot.jpg
      - name: Container logs
        if: always()
        run: docker logs smoke || true
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
