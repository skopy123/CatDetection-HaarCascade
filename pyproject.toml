[project]
name = "catalarm"
version = "2.0.0"
description = "Multi-camera cat recognition with web UI and Home Assistant integration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.19",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
catalarm = "catalarm.main:run"

[project.optional-dependencies]
# only needed to export ONNX models (Docker "models" stage), never at runtime
export = [
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
    "onnx>=1.16",
    "onnxslim>=0.1.30",
    "timm>=1.0",
    "transformers>=4.56",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalarm"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy", "PoCandTests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires exported ONNX models (run inside the Docker image)"]
addopts = "-m 'not models'"
